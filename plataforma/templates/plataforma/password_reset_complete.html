{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña actualizada | Universidad de Guayaquil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#1B3A6B', light: '#2C5590', dark: '#122748' },
          gold: { DEFAULT: '#F5A623', light: '#FDF1E0' },
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      },
    },
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-6 py-10">

<div class="w-full max-w-sm text-center">

  <div class="w-16 h-16 rounded-full bg-green-50 border border-green-200 flex items-center justify-center mx-auto mb-6">
    <i class="ti ti-circle-check text-3xl text-green-600" aria-hidden="true"></i>
  </div>

  <h2 class="text-navy text-xl font-semibold mb-2">¡Contraseña actualizada!</h2>
  <p class="text-gray-500 text-sm mb-8">Ya puedes iniciar sesión con tu nueva contraseña.</p>

  <a href="{% url 'login' %}"
     class="inline-flex items-center gap-2 bg-gold hover:bg-gold/90 text-navy-dark font-semibold px-6 py-3 rounded-lg transition-colors">
    <i class="ti ti-login" aria-hidden="true"></i> Iniciar sesión
  </a>

</div>
</body>
</html>
