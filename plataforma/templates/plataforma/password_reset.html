{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña | Universidad de Guayaquil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { DEFAULT: '#1B3A6B', light: '#2C5590', dark: '#122748' },
          gold: { DEFAULT: '#F5A623', light: '#FDF1E0' },
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      },
    },
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-6 py-10">

<div class="w-full max-w-sm">

  <div class="text-center mb-8">
    <div class="w-12 h-12 rounded-full bg-gold-light mx-auto mb-3 flex items-center justify-center">
      <i class="ti ti-key text-2xl text-navy" aria-hidden="true"></i>
    </div>
    <h2 class="text-navy text-xl font-semibold">Recuperar contraseña</h2>
    <p class="text-gray-500 text-sm mt-1">Ingresa tu email y te enviaremos un enlace para restablecerla</p>
  </div>

  <form method="post">
    {% csrf_token %}

    <label for="id_email" class="block text-sm text-gray-600 mb-1">Email</label>
    <div class="relative mb-6">
      <i class="ti ti-at absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
      <input type="email" name="email" id="id_email" placeholder="tu@correo.com" required
             class="w-full pl-10 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-light/30">
    </div>

    <button type="submit"
            class="w-full bg-navy hover:bg-navy-dark text-white text-sm font-medium py-2.5 rounded-lg transition-colors">
      Enviar enlace de recuperación
    </button>
  </form>

  <p class="text-center text-sm text-gray-500 mt-6">
    <a href="{% url 'login' %}" class="text-navy hover:underline">← Volver a iniciar sesión</a>
  </p>

</div>
</body>
</html>
