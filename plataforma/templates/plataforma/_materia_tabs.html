{% with url_name=request.resolver_match.url_name %}
<nav aria-label="Secciones de la materia" class="flex items-center gap-1 border-b border-gray-200 mb-6">
  <a href="{% url 'docente_materia_tareas' materia.id %}"
     class="px-3 py-2 text-sm font-medium border-b-2 -mb-px transition-colors
            {% if url_name == 'docente_materia_tareas' or url_name == 'docente_tarea_entregas' %}border-navy text-navy{% else %}border-transparent text-gray-500 hover:text-navy hover:border-gray-300{% endif %}"
     {% if url_name == 'docente_materia_tareas' or url_name == 'docente_tarea_entregas' %}aria-current="page"{% endif %}>
    Tareas
  </a>
  <a href="{% url 'docente_materia_estudiantes' materia.id %}"
     class="px-3 py-2 text-sm font-medium border-b-2 -mb-px transition-colors
            {% if url_name == 'docente_materia_estudiantes' %}border-navy text-navy{% else %}border-transparent text-gray-500 hover:text-navy hover:border-gray-300{% endif %}"
     {% if url_name == 'docente_materia_estudiantes' %}aria-current="page"{% endif %}>
    Estudiantes
  </a>
  <a href="{% url 'docente_materia_planificacion' materia.id %}"
     class="px-3 py-2 text-sm font-medium border-b-2 -mb-px transition-colors
            {% if url_name == 'docente_materia_planificacion' or url_name == 'docente_calificar_parcial' %}border-navy text-navy{% else %}border-transparent text-gray-500 hover:text-navy hover:border-gray-300{% endif %}"
     {% if url_name == 'docente_materia_planificacion' or url_name == 'docente_calificar_parcial' %}aria-current="page"{% endif %}>
    Planificación
  </a>
</nav>
{% endwith %}
