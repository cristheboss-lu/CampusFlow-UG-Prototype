{% extends "plataforma/base.html" %}

{% block title %}Mensaje enviado | Universidad de Guayaquil{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-10">

    <div class="w-16 h-16 rounded-full bg-green-50 border border-green-200 flex items-center justify-center mx-auto mb-6">
        <i class="ti ti-circle-check text-3xl text-green-600" aria-hidden="true"></i>
    </div>

    <h1 class="text-2xl font-semibold text-navy mb-2">¡Mensaje enviado correctamente!</h1>
    <p class="text-gray-500 mb-8">Gracias por tu mensaje. Nos pondremos en contacto pronto.</p>

    <a href="{% url 'index' %}"
       class="inline-flex items-center gap-2 bg-gold hover:bg-gold/90 text-navy-dark font-semibold px-6 py-3 rounded-lg transition-colors">
        <i class="ti ti-home" aria-hidden="true"></i> Volver al inicio
    </a>

</div>
{% endblock %}
